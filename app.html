<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accounting System</title>

    <link rel="stylesheet" href="app.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>
        <h1>Accounting System</h1>

        <ul>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#customers">Customers</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#sales">Sales</a></li>
            <li><a href="#expenses">Expenses</a></li>
        </ul>
    </nav>


    <main>

        <!-- =========================
             DASHBOARD
        ========================== -->

        <section id="dashboard">

            <h2>Dashboard</h2>

            <div>
                <h3>Total Sales</h3>
                <p id="total-sales">0</p>
            </div>

            <div>
                <h3>Total Expenses</h3>
                <p id="total-expenses">0</p>
            </div>

            <div>
                <h3>Total Profit</h3>
                <p id="total-profit">0</p>
            </div>

        </section>


        <!-- =========================
             CUSTOMERS
        ========================== -->

        <section id="customers">

            <h2>Customers</h2>

            <form id="customer-form">

                <label for="customer-name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="customer-name"
                    placeholder="Enter customer name"
                >

                <button type="submit">
                    Add Customer
                </button>

            </form>

            <h3>Customer List</h3>

            <div id="customers-list"></div>

        </section>


        <!-- =========================
             PRODUCTS
        ========================== -->

        <section id="products">

            <h2>Products</h2>

            <form id="product-form">

                <label for="product-name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="product-name"
                    placeholder="Enter product name"
                >


                <label for="buying-price">
                    Buying Price
                </label>

                <input
                    type="number"
                    id="buying-price"
                    placeholder="Enter buying price"
                    min="0"
                    step="0.01"
                >


                <label for="selling-price">
                    Selling Price
                </label>

                <input
                    type="number"
                    id="selling-price"
                    placeholder="Enter selling price"
                    min="0"
                    step="0.01"
                >


                <label for="product-quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="product-quantity"
                    placeholder="Enter quantity"
                    min="1"
                >


                <button type="submit">
                    Add Product
                </button>

            </form>

            <h3>Product List</h3>

            <div id="products-list"></div>

        </section>


        <!-- =========================
             SALES
        ========================== -->

        <section id="sales">

            <h2>Sales</h2>

            <form id="sales-form">

                <label for="sale-customer">
                    Customer
                </label>

                <select id="sale-customer">

                    <option value="">
                        Select Customer
                    </option>

                </select>


                <label for="sale-product">
                    Product
                </label>

                <select id="sale-product">

                    <option value="">
                        Select Product
                    </option>

                </select>


                <label for="sale-quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="sale-quantity"
                    placeholder="Enter quantity"
                    min="1"
                >


                <p>
                    Sale Total:
                    <span id="sale-total">0</span>
                </p>


                <button type="submit">
                    Record Sale
                </button>

            </form>

            <h3>Sales List</h3>

            <div id="sales-list"></div>

        </section>


        <!-- =========================
             EXPENSES
        ========================== -->

        <section id="expenses">

            <h2>Expenses</h2>

            <form id="expense-form">

                <label for="expense-name">
                    Expense Name
                </label>

                <input
                    type="text"
                    id="expense-name"
                    placeholder="Enter expense name"
                >


                <label for="expense-category">
                    Category
                </label>

                <input
                    type="text"
                    id="expense-category"
                    placeholder="Enter category"
                >


                <label for="expense-amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="expense-amount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                >


                <label for="expense-date">
                    Date
                </label>

                <input
                    type="date"
                    id="expense-date"
                >


                <button type="submit">
                    Add Expense
                </button>

            </form>

            <h3>Expense List</h3>

            <div id="expenses-list"></div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
